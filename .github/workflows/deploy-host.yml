name: Deploy Arc mainnet host

# Manual release only after Arc configuration and lifecycle verification.
# Required repository variable: ARC_MAINNET_READY=true.
# Required SSH secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY (this edition only).

on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/livestreak-mainnet-host

jobs:
  # dorny/paths-filter so host/** auto-covers new files while !**/*.md skips doc-only
  # commits. Inputs = host/ + the workspace packages host imports + its Dockerfile +
  # this workflow. Kept in lockstep with host/Dockerfile's COPY list.
  changes:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.filter.outputs.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            host:
              - 'host/**'
              - 'packages/core/**'
              - 'packages/schema/**'
              - 'packages/wallet/**'
              - 'packages/contracts/**'
              - 'packages/host/**'
              - 'packages/options/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.dockerignore'
              - '.github/workflows/deploy-host.yml'
              - '!**/*.md'

  build-and-deploy:
    needs: changes
    # Publish only from main after the Arc readiness gate has been enabled.
    if: ${{ github.ref == 'refs/heads/main' && vars.ARC_MAINNET_READY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: host/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            IMAGE=ghcr.io/${{ github.repository_owner }}/livestreak-mainnet-host:latest
            docker pull "$IMAGE"
            docker stop livestreak-mainnet-host 2>/dev/null || true
            docker rm livestreak-mainnet-host 2>/dev/null || true
            # Plain port mapping (no --network host): the live video path is now an
            # encode-once fMP4 byte fan-out over WS on the single HTTP port (8788) — there
            # is no UDP media relay to allocate, so host networking is no longer needed and
            # a bridge with an explicit port map is the safer default. Runtime config comes
            # from the VPS-side env file, never from the image.
            docker run -d \
              --name livestreak-mainnet-host \
              --restart unless-stopped \
              -p 8788:8788 \
              --env-file /home/ubuntu/livestreak-mainnet-host.env \
              "$IMAGE"
            echo "--- waiting for health ---"
            sleep 5
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8788/health || echo 000)
            echo "GET /health -> $code"
            docker logs --tail 20 livestreak-mainnet-host || true
