name: Deploy Arc mainnet app

# Manual release only after Arc configuration and lifecycle verification.
# Required repository variable: ARC_MAINNET_READY=true.
# Required SSH secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY (this edition only).

on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # ghcr requires a lowercase path; repository_owner is normally already lowercase.
  IMAGE_NAME: ${{ github.repository_owner }}/livestreak-mainnet-app

jobs:
  # Decide whether anything that affects the image actually changed. Using
  # dorny/paths-filter (not the native `paths:` allowlist) so that `app/**`
  # auto-covers new files, while `!**/*.md` skips doc-only commits. This way a
  # README/docs change never triggers a build, but new code anywhere under the
  # build inputs always does — no brittle list to keep in sync.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'packages/wallet/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'Dockerfile'
              - '.github/workflows/deploy-app.yml'
              - '!**/*.md'

  build-and-deploy:
    needs: changes
    # Publish only from main after the Arc readiness gate has been enabled.
    if: ${{ github.ref == 'refs/heads/main' && vars.ARC_MAINNET_READY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            IMAGE=ghcr.io/${{ github.repository_owner }}/livestreak-mainnet-app:latest
            docker pull "$IMAGE"
            docker network create livestreak-mainnet-network 2>/dev/null || true
            docker stop livestreak-mainnet-app 2>/dev/null || true
            docker rm livestreak-mainnet-app 2>/dev/null || true
            docker run -d \
              --name livestreak-mainnet-app \
              --restart unless-stopped \
              --network livestreak-mainnet-network \
              -p 3002:3000 \
              "$IMAGE"
            echo "--- waiting for health ---"
            sleep 5
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/ || echo 000)
            echo "GET / -> $code"
            docker logs --tail 20 livestreak-mainnet-app || true
